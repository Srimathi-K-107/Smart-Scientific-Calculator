<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Calculator</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container-fluid calculator-page">
    <div class="parent">

        <!-- Header -->
        <div class="header">
            <div>
                <span class="brand-label">SMART TOOLS</span>
                <h1>Calculator<span>.</span></h1>
                <p>Simple calculations, smarter results.</p>
            </div>

            <div class="icon">
                <button class="icon-btn" id="copy" aria-label="Copy result">
                    <i class="ri-file-copy-line"></i>
                </button>
                <button class="icon-btn" id="theme" aria-label="Toggle theme">
                    <i class="ri-moon-line"></i>
                </button>
            </div>
        </div>

        <!-- Display -->
        <div class="result">
            <div class="display-label">CURRENT CALCULATION</div>
            <small id="resultexp"></small>
            <textarea id="result" placeholder="0" readonly></textarea>
        </div>

        <!-- Memory -->
        <div class="memory">
            <button class="btn" id="memoryclear">MC</button>
            <button class="btn" id="memoryrecall">MR</button>
            <button class="btn" id="memoryplus">M+</button>
            <button class="btn" id="memoryminus">M-</button>
        </div>

        <!-- Main layout -->
        <div class="row g-4 calculator-content">

            <div class="col-12 col-lg-8">

                <!-- Scientific buttons -->
                <div class="scientific">
                    <button class="btn" data-scientific="sin">sin</button>
                    <button class="btn" data-scientific="cos">cos</button>
                    <button class="btn" data-scientific="tan">tan</button>
                    <button class="btn" data-scientific="sqrt">√</button>
                    <button class="btn" data-scientific="square">x²</button>
                    <button class="btn" data-scientific="log">log</button>
                    <button class="btn" data-scientific="ln">ln</button>
                    <button class="btn" data-scientific="power">xʸ</button>
                    <button class="btn" id="openbracket">(</button>
                    <button class="btn" id="closebracket">)</button>
                </div>

                <!-- Number pad + operators -->
                <div class="calcdiv">

                    <div class="numbersdiv">
                        <button class="btn special-btn" id="clear">AC</button>
                        <button class="btn special-btn" id="backbracket">⌫</button>
                        <button class="btn special-btn" id="percentage">%</button>

                        <button class="btn" id="seven">7</button>
                        <button class="btn" id="eight">8</button>
                        <button class="btn" id="nine">9</button>

                        <button class="btn" id="four">4</button>
                        <button class="btn" id="five">5</button>
                        <button class="btn" id="six">6</button>

                        <button class="btn" id="one">1</button>
                        <button class="btn" id="two">2</button>
                        <button class="btn" id="three">3</button>

                        <button class="btn" id="dot">.</button>
                        <button class="btn zero-btn" id="zero">0</button>
                    </div>

                    <div class="operationdiv">
                        <button class="btn operator-btn" id="div">÷</button>
                        <button class="btn operator-btn" id="mul">×</button>
                        <button class="btn operator-btn" id="sub">−</button>
                        <button class="btn operator-btn" id="add">+</button>
                        <button class="btn equal-btn" id="equal">=</button>
                    </div>

                </div>
            </div>

            <!-- History -->
            <div class="col-12 col-lg-4">
                <div class="history h-100">
                    <div class="hisheader">
                        <div>
                            <span class="history-label">YOUR ACTIVITY</span>
                            <h3>History</h3>
                        </div>
                        <button class="btn" id="clearhis">
                            <i class="ri-delete-bin-line"></i> Clear
                        </button>
                    </div>

                    <div class="historymsg" id="historyaddingdiv">
                        <div class="empty-history">
                            <i class="ri-history-line"></i>
                            <p id="msg">No calculation yet</p>
                            <small>Your calculations will appear here.</small>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="footer-text">
            <span>SMART CALCULATOR</span>
            <span>Designed for everyday math</span>
        </div>

    </div>
</div>

<script src="main.js"></script>
</body>
</html>
